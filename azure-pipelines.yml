trigger:
  - main

pr:
  - main

pool:
  name: NayaInfra

variables:
  terraformVersion: '1.10.5'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

stages:

# =========================================================
# STAGE 1 - TERRAFORM VALIDATION + SECURITY SCANNING
# =========================================================

- stage: Terraform_Validate_Scan
  displayName: 'Terraform Validate & Security Scan'
  jobs:

  - job: ValidateAndScan
    displayName: 'Terraform Validation and IaC Security'

    steps:

    # -----------------------------------------------------
    # Checkout Source Code
    # -----------------------------------------------------

    - checkout: self
      clean: true

    # -----------------------------------------------------
    # Install Terraform
    # -----------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    # -----------------------------------------------------
    # Terraform Version
    # -----------------------------------------------------

    - script: |
        terraform version
      displayName: 'Terraform Version'

    # -----------------------------------------------------
    # Terraform Format Check
    # -----------------------------------------------------

    - script: |
        terraform fmt -check -recursive
      displayName: 'Terraform Format Check'
      workingDirectory: '$(workingDirectory)'

    # -----------------------------------------------------
    # Terraform Init
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: 'NayaInfra'
        backendAzureRmStorageAccountName: 'gssstrg'
        backendAzureRmContainerName: 'gsscontainer'
        backendAzureRmKey: 'backup.tfstate'

    # -----------------------------------------------------
    # Terraform Validate
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Validate'
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(workingDirectory)'

    # =====================================================
    # TFLINT
    # =====================================================

    - script: |
        tflint --version
      displayName: 'Check TFLint'

    - script: |
        tflint --init
        tflint --recursive
      displayName: 'TFLint Scan'
      workingDirectory: '$(workingDirectory)'

    # =====================================================
    # CHECKOV
    # =====================================================

    - script: |
        python -m pip install --upgrade pip
        pip install checkov
        checkov --version
      displayName: 'Install Checkov'

    - script: |
        checkov -d . --framework terraform
      displayName: 'Checkov IaC Security Scan'
      workingDirectory: '$(workingDirectory)'

    # =====================================================
    # TRIVY IaC SCAN
    # =====================================================

    - script: |
        trivy --version
      displayName: 'Check Trivy'

    - script: |
        trivy config . --severity HIGH,CRITICAL
      displayName: 'Trivy Infrastructure Security Scan'
      workingDirectory: '$(workingDirectory)'


# =========================================================
# STAGE 2 - TERRAFORM PLAN
# =========================================================

- stage: Terraform_Plan
  displayName: 'Terraform Plan'
  dependsOn: Terraform_Validate_Scan
  condition: succeeded()

  jobs:

  - job: TerraformPlan
    displayName: 'Generate Terraform Plan'

    steps:

    - checkout: self
      clean: true

    # -----------------------------------------------------
    # Terraform
    # -----------------------------------------------------

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    # -----------------------------------------------------
    # Terraform Init
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: 'NayaInfra'
        backendAzureRmStorageAccountName: 'gssstrg'
        backendAzureRmContainerName: 'gsscontainer'
        backendAzureRmKey: 'backup.tfstate'

    # -----------------------------------------------------
    # Terraform Plan
    # -----------------------------------------------------

    - task: TerraformTask@5
      displayName: 'Terraform Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        environmentServiceNameAzureRM: 'NayaInfra'
        commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'

    # -----------------------------------------------------
    # Publish Terraform Plan
    # -----------------------------------------------------

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Terraform Plan'
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)'
        artifactName: 'terraform-plan'


# =========================================================
# STAGE 3 - TERRAFORM APPLY
# =========================================================

- stage: Terraform_Apply
  displayName: 'Terraform Apply'
  dependsOn: Terraform_Plan
  condition: succeeded()

  jobs:

  - deployment: TerraformApply
    displayName: 'Deploy Azure Infrastructure'
    environment: 'Production'
    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self
            clean: true

          # ------------------------------------------------
          # Terraform
          # ------------------------------------------------

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          # ------------------------------------------------
          # Terraform Init
          # ------------------------------------------------

          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: 'NayaInfra'
              backendAzureRmStorageAccountName: 'gssstrg'
              backendAzureRmContainerName: 'gsscontainer'
              backendAzureRmKey: 'backup.tfstate'

          # ------------------------------------------------
          # Terraform Apply
          # ------------------------------------------------

          - task: TerraformTask@5
            displayName: 'Terraform Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              environmentServiceNameAzureRM: 'NayaInfra'
              commandOptions: '-auto-approve'
